receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  otlp/honeycomb:
    endpoint: "https://api.honeycomb.io:443"
    headers:
      x-honeycomb-team: "${HONEYCOMB_API_KEY}"
      x-honeycomb-dataset: "${HONEYCOMB_DATASET}"
  
  otlp/jaeger:
    endpoint: "jaeger:4317"    # Name matches your docker-compose Jaeger service
    tls:
      insecure: true           # Disable TLS for local testing

processors:
  batch: {}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/honeycomb,otlp/jaeger]