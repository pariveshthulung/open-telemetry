receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  otlp/honeycomb:
    endpoint: "https://api.honeycomb.io:443"
    headers:
      x-honeycomb-team: "${HONEYCOMB_API_KEY}"
      x-honeycomb-dataset: "${HONEYCOMB_DATASET}"

  otlp/aspire:
    endpoint: "http://aspire-dashboard:18889"
    tls:
      insecure: true
  
  otlp/jaeger:
    endpoint: "jaeger:4317"   
    tls:
      insecure: true         

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/honeycomb,otlp/jaeger,otlp/aspire]

    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/aspire]

    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/honeycomb,otlp/aspire]
